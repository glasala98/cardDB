name: Catalog Tier — Stars (Monthly)

# Stars = notable rookies + parallels. stale-days 30 — repriced once a month.
# Connection budget: 4 sports × 1 flush-conn = 4 peak connections ✅

concurrency:
  group: catalog-tier-stars
  cancel-in-progress: true

on:
  schedule:
    - cron: '0 8 1 * *'   # monthly — 1st of month 8am UTC
  workflow_dispatch:
    inputs:
      sport:
        description: 'Sport (NHL/NBA/NFL/MLB, blank=all)'
        required: false
        default: ''
      limit:
        description: 'Max cards per sport (0=all)'
        required: false
        default: '0'

jobs:
  scrape-stars-nhl:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: ${{ github.event.inputs.sport == '' || github.event.inputs.sport == 'NHL' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: pip install -r requirements.txt scipy
      - name: Scrape NHL stars prices
        run: python -u scraping/scrape_master_db.py --catalog-tier stars --sport NHL --workers 5 --stale-days 30 --max-hours 0.85 --limit ${{ github.event.inputs.limit || '0' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  scrape-stars-nba:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: ${{ github.event.inputs.sport == '' || github.event.inputs.sport == 'NBA' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: pip install -r requirements.txt scipy
      - name: Scrape NBA stars prices
        run: python -u scraping/scrape_master_db.py --catalog-tier stars --sport NBA --workers 5 --stale-days 30 --max-hours 0.85 --limit ${{ github.event.inputs.limit || '0' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  scrape-stars-nfl:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: ${{ github.event.inputs.sport == '' || github.event.inputs.sport == 'NFL' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: pip install -r requirements.txt scipy
      - name: Scrape NFL stars prices
        run: python -u scraping/scrape_master_db.py --catalog-tier stars --sport NFL --workers 5 --stale-days 30 --max-hours 0.85 --limit ${{ github.event.inputs.limit || '0' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  scrape-stars-mlb:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: ${{ github.event.inputs.sport == '' || github.event.inputs.sport == 'MLB' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: pip install -r requirements.txt scipy
      - name: Scrape MLB stars prices
        run: python -u scraping/scrape_master_db.py --catalog-tier stars --sport MLB --workers 5 --stale-days 30 --max-hours 0.85 --limit ${{ github.event.inputs.limit || '0' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
