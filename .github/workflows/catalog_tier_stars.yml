name: Catalog Tier — Stars (Daily)

# Stars = 66% complete, ~16.5K cards remaining. Runs 2x/day.
# With base paused: stars(20) + staple(20) + premium(20) + app(5) = 65 max ✅

concurrency:
  group: catalog-tier-stars
  cancel-in-progress: true

on:
  schedule:
    - cron: '0 4 * * *'   # 4am  UTC
    - cron: '0 14 * * *'  # 2pm  UTC
  workflow_dispatch:
    inputs:
      sport:
        description: 'Sport (NHL/NBA/NFL/MLB, blank=all)'
        required: false
        default: ''
      limit:
        description: 'Max cards per sport (0=all)'
        required: false
        default: '0'

jobs:
  notify-start:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: dawidd6/action-send-mail@v3
        continue-on-error: true
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.NOTIFY_GMAIL_USER }}
          password: ${{ secrets.NOTIFY_GMAIL_APP_PASSWORD }}
          to: ${{ secrets.NOTIFY_EMAIL_TO }}
          from: "CardDB Monitor <${{ secrets.NOTIFY_GMAIL_USER }}>"
          subject: "▶️ CardDB — Stars scrape started (NHL/NBA/NFL/MLB)"
          body: |
            Stars-tier scrape has started across all 4 sports (parallel).

            Triggered by: ${{ github.event_name }}
            Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

  scrape-stars-nhl:
    needs: notify-start
    if: always() && (github.event.inputs.sport == '' || github.event.inputs.sport == 'NHL')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Chrome
        run: |
          wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y /tmp/chrome.deb || sudo apt-get -f install -y
      - name: Install Python dependencies
        run: pip install -r requirements.txt webdriver-manager scipy
      - name: Scrape NHL stars prices
        run: python -u scraping/scrape_master_db.py --catalog-tier stars --sport NHL --workers 5 --stale-days 30 --max-hours 5 --limit ${{ github.event.inputs.limit || '0' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  scrape-stars-nba:
    needs: notify-start
    if: always() && (github.event.inputs.sport == '' || github.event.inputs.sport == 'NBA')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Chrome
        run: |
          wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y /tmp/chrome.deb || sudo apt-get -f install -y
      - name: Install Python dependencies
        run: pip install -r requirements.txt webdriver-manager scipy
      - name: Scrape NBA stars prices
        run: python -u scraping/scrape_master_db.py --catalog-tier stars --sport NBA --workers 5 --stale-days 30 --max-hours 5 --limit ${{ github.event.inputs.limit || '0' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  scrape-stars-nfl:
    needs: notify-start
    if: always() && (github.event.inputs.sport == '' || github.event.inputs.sport == 'NFL')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Chrome
        run: |
          wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y /tmp/chrome.deb || sudo apt-get -f install -y
      - name: Install Python dependencies
        run: pip install -r requirements.txt webdriver-manager scipy
      - name: Scrape NFL stars prices
        run: python -u scraping/scrape_master_db.py --catalog-tier stars --sport NFL --workers 5 --stale-days 30 --max-hours 5 --limit ${{ github.event.inputs.limit || '0' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  scrape-stars-mlb:
    needs: notify-start
    if: always() && (github.event.inputs.sport == '' || github.event.inputs.sport == 'MLB')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Chrome
        run: |
          wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y /tmp/chrome.deb || sudo apt-get -f install -y
      - name: Install Python dependencies
        run: pip install -r requirements.txt webdriver-manager scipy
      - name: Scrape MLB stars prices
        run: python -u scraping/scrape_master_db.py --catalog-tier stars --sport MLB --workers 5 --stale-days 30 --max-hours 5 --limit ${{ github.event.inputs.limit || '0' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  notify-done:
    needs: [scrape-stars-nhl, scrape-stars-nba, scrape-stars-nfl, scrape-stars-mlb]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: dawidd6/action-send-mail@v3
        continue-on-error: true
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.NOTIFY_GMAIL_USER }}
          password: ${{ secrets.NOTIFY_GMAIL_APP_PASSWORD }}
          to: ${{ secrets.NOTIFY_EMAIL_TO }}
          from: "CardDB Monitor <${{ secrets.NOTIFY_GMAIL_USER }}>"
          subject: "✅ CardDB — Stars scrape done (NHL/NBA/NFL/MLB)"
          body: |
            Stars-tier scrape has completed.

            NHL: ${{ needs.scrape-stars-nhl.result }}
            NBA: ${{ needs.scrape-stars-nba.result }}
            NFL: ${{ needs.scrape-stars-nfl.result }}
            MLB: ${{ needs.scrape-stars-mlb.result }}

            Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
