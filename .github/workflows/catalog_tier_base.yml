name: Catalog Tier — Base (Backfill)

# Scrapes price data for base-tier cards (2015+), running every 6h 24/7.
# Goal: get all base cards priced as fast as possible → flip to delta mode.
#
# Sharding — each shard processes ~2,700 cards per 5.5h window (eBay rate limit):
#   NFL: 10 shards (479k total → ~48k/shard → ~18 runs → ~4.5 days)
#   NBA:  8 shards (299k total → ~37k/shard → ~14 runs → ~3.5 days)
#   MLB: 16 shards (765k total → ~48k/shard → ~18 runs → ~4.5 days) ← biggest
#   NHL:  skipped  (89%+ miss rate on base tier, revisit post-backfill)
# = 34 parallel runners, connection budget: 34 + 20 staple + 10 app = 64 ✅
#
# Staggered 3h from staple (runs at 3/9/15/21 UTC, staple at 0/6/12/18 UTC)
# so they don't compete for DB connections at startup.

on:
  schedule:
    - cron: '0 3,9,15,21 * * *'   # every 6h, offset 3h from staple
  workflow_dispatch:
    inputs:
      sport:
        description: 'Sport (NHL/NBA/NFL/MLB, blank=all)'
        required: false
        default: ''
      year_from:
        description: 'Start year (default: 2015)'
        required: false
        default: '2015'
      limit:
        description: 'Max cards per shard (0=all)'
        required: false
        default: '0'
      stale_days:
        description: 'Re-scrape if older than N days (default: 30)'
        required: false
        default: '30'

concurrency:
  group: base-scrape-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  scrape:
    # preflight removed — DB health check was timing out under scrape load,
    # blocking all runs. DB size is monitored separately via db_health_check.yml.
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      # CONNECTION BUDGET: 20 base + 20 staple + 10 app = 50 peak ✅
      # GH free plan limit: 20 concurrent jobs. max-parallel=20 means GH runs
      # 20 at a time and queues the remaining 14 shards internally — they start
      # as slots free up within the same workflow run. No external queuing.
      max-parallel: 20
      matrix:
        include:
          # NFL — 10 shards (~48K cards each, ~18 runs to clear)
          - { sport: NFL, shard_index: 0, shard_count: 10 }
          - { sport: NFL, shard_index: 1, shard_count: 10 }
          - { sport: NFL, shard_index: 2, shard_count: 10 }
          - { sport: NFL, shard_index: 3, shard_count: 10 }
          - { sport: NFL, shard_index: 4, shard_count: 10 }
          - { sport: NFL, shard_index: 5, shard_count: 10 }
          - { sport: NFL, shard_index: 6, shard_count: 10 }
          - { sport: NFL, shard_index: 7, shard_count: 10 }
          - { sport: NFL, shard_index: 8, shard_count: 10 }
          - { sport: NFL, shard_index: 9, shard_count: 10 }
          # NBA — 8 shards (~37K cards each, ~14 runs to clear)
          - { sport: NBA, shard_index: 0, shard_count: 8 }
          - { sport: NBA, shard_index: 1, shard_count: 8 }
          - { sport: NBA, shard_index: 2, shard_count: 8 }
          - { sport: NBA, shard_index: 3, shard_count: 8 }
          - { sport: NBA, shard_index: 4, shard_count: 8 }
          - { sport: NBA, shard_index: 5, shard_count: 8 }
          - { sport: NBA, shard_index: 6, shard_count: 8 }
          - { sport: NBA, shard_index: 7, shard_count: 8 }
          # MLB — 16 shards (~48K cards each, ~18 runs to clear) — was 6, too slow
          - { sport: MLB, shard_index: 0, shard_count: 16 }
          - { sport: MLB, shard_index: 1, shard_count: 16 }
          - { sport: MLB, shard_index: 2, shard_count: 16 }
          - { sport: MLB, shard_index: 3, shard_count: 16 }
          - { sport: MLB, shard_index: 4, shard_count: 16 }
          - { sport: MLB, shard_index: 5, shard_count: 16 }
          - { sport: MLB, shard_index: 6, shard_count: 16 }
          - { sport: MLB, shard_index: 7, shard_count: 16 }
          - { sport: MLB, shard_index: 8, shard_count: 16 }
          - { sport: MLB, shard_index: 9, shard_count: 16 }
          - { sport: MLB, shard_index: 10, shard_count: 16 }
          - { sport: MLB, shard_index: 11, shard_count: 16 }
          - { sport: MLB, shard_index: 12, shard_count: 16 }
          - { sport: MLB, shard_index: 13, shard_count: 16 }
          - { sport: MLB, shard_index: 14, shard_count: 16 }
          - { sport: MLB, shard_index: 15, shard_count: 16 }
          # NHL — skipped (89%+ miss rate on base tier; revisit post-backfill)

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Chrome
        run: |
          wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y /tmp/chrome.deb || sudo apt-get -f install -y

      - name: Install Python dependencies
        run: pip install -r requirements.txt webdriver-manager scipy

      # Notify once per sport (shard 0 only) to avoid duplicate emails
      - name: Notify — scrape started
        if: matrix.shard_index == 0
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.NOTIFY_GMAIL_USER }}
          password: ${{ secrets.NOTIFY_GMAIL_APP_PASSWORD }}
          to: ${{ secrets.NOTIFY_EMAIL_TO }}
          from: "CardDB Monitor <${{ secrets.NOTIFY_GMAIL_USER }}>"
          subject: "▶️ CardDB — Base scrape started: ${{ matrix.sport }} (${{ matrix.shard_count }} shards)"
          body: |
            ${{ matrix.sport }} base-tier scrape has started (${{ matrix.shard_count }} parallel shards).

            Triggered by: ${{ github.event_name }}
            Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Scrape base prices
        if: ${{ github.event.inputs.sport == '' || github.event.inputs.sport == matrix.sport }}
        run: |
          python -u scraping/scrape_master_db.py \
            --catalog-tier base \
            --sport ${{ matrix.sport }} \
            --workers 2 \
            --year-from ${{ github.event.inputs.year_from || '2015' }} \
            --stale-days ${{ github.event.inputs.stale_days || '30' }} \
            --limit ${{ github.event.inputs.limit || '0' }} \
            --shard-index ${{ matrix.shard_index }} \
            --shard-count ${{ matrix.shard_count }} \
            --max-hours 5.5
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Generate cancellation report
        id: cancel_report
        if: cancelled() && matrix.shard_index == 0
        continue-on-error: true
        run: |
          pip install psycopg2-binary -q
          DB_SIZE=$(python -c "
          import os, psycopg2
          try:
              conn = psycopg2.connect(os.environ['DATABASE_URL'])
              cur = conn.cursor()
              cur.execute(\"SELECT pg_size_pretty(pg_database_size(current_database()))\")
              print(cur.fetchone()[0])
              cur.close(); conn.close()
          except:
              print('unavailable')
          ")
          echo "db_size=$DB_SIZE" >> $GITHUB_OUTPUT
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Notify cancel once per sport (shard 0 only)
      - name: Notify — scrape cancelled
        if: cancelled() && matrix.shard_index == 0
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.NOTIFY_GMAIL_USER }}
          password: ${{ secrets.NOTIFY_GMAIL_APP_PASSWORD }}
          to: ${{ secrets.NOTIFY_EMAIL_TO }}
          from: "CardDB Monitor <${{ secrets.NOTIFY_GMAIL_USER }}>"
          subject: "⚠️ CardDB — Base scrape STOPPED early: ${{ matrix.sport }}"
          body: |
            ${{ matrix.sport }} base-tier scrape was STOPPED before completing.

            DB size at cancellation: ${{ steps.cancel_report.outputs.db_size }}

            Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            To restart ${{ matrix.sport }} only:
              gh workflow run catalog_tier_base.yml --ref main -f sport=${{ matrix.sport }}
