name: Test Fast Path (Manual)

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install curl_cffi beautifulsoup4 -q
      - name: Test fast path end-to-end
        run: |
          python3 - <<'EOF'
          import sys, os
          sys.path.insert(0, 'scraping')
          from curl_cffi import requests as cffi
          import urllib.parse, re, time
          from bs4 import BeautifulSoup
          from scrape_card_prices import _fetch_ebay_html, _parse_ebay_items

          card_name = "2021-22 Upper Deck - Young Guns #201 - Connor Bedard"
          q = urllib.parse.quote("2021 upper deck young guns connor bedard")
          url = f"https://www.ebay.com/sch/i.html?_nkw={q}&_sacat=0&LH_Complete=1&LH_Sold=1&_sop=13&_ipg=240"

          t0 = time.time()
          html = _fetch_ebay_html(url)
          fetch_ms = int((time.time() - t0) * 1000)
          print(f"Fetch: {fetch_ms}ms, HTML length: {len(html) if html else 0}")

          if html:
              t1 = time.time()
              sales = _parse_ebay_items(html, url, card_name)
              parse_ms = int((time.time() - t1) * 1000)
              print(f"Parse: {parse_ms}ms")
              if sales is None:
                  print("RESULT: None → Selenium fallback (layout not recognised)")
              elif len(sales) == 0:
                  print("RESULT: 0 sales (no-results page or all filtered)")
              else:
                  print(f"RESULT: {len(sales)} sales parsed ✅")
                  print(f"  Sample: {sales[0]['title'][:60]} | ${sales[0]['price_val']} | {sales[0]['sold_date']}")
                  print(f"Total fast path time: {fetch_ms + parse_ms}ms vs ~5000ms Selenium")
          else:
              print("RESULT: fetch failed → Selenium fallback")
          EOF
