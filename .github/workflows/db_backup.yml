name: DB Backup — Weekly pg_dump

# Dumps the Railway PostgreSQL database and uploads as a GitHub Actions artifact.
# Download from: Actions tab → DB Backup → click any run → Artifacts → db-backup
#
# Artifact retention: 90 days (GitHub default for paid plans)
# Schedule: every Sunday at 2am UTC (after graded scraper finishes ~1:30am)
# Manual trigger also available via workflow_dispatch

on:
  schedule:
    - cron: '0 2 * * 0'   # Sunday 2am UTC
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get update -q
          sudo apt-get install -y curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update -q
          sudo apt-get install -y postgresql-client-17

      - name: Run pg_dump
        run: |
          /usr/lib/postgresql/17/bin/pg_dump "$DATABASE_URL" \
            --no-password \
            --format=custom \
            --compress=9 \
            --file=carddb_backup_$(date +%Y-%m-%d).dump
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_number }}-${{ github.run_id }}
          path: carddb_backup_*.dump
          retention-days: 90
          if-no-files-found: error
