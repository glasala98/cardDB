name: Quick Stats Check
on:
  workflow_dispatch:
jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run stats
        run: |
          pip install psycopg2-binary -q
          python - << 'PYEOF'
          import os, psycopg2
          conn = psycopg2.connect(os.environ["DATABASE_URL"])
          cur = conn.cursor()

          cur.execute("""
              SELECT sport, scrape_tier, COUNT(*) as total
              FROM card_catalog
              GROUP BY sport, scrape_tier
              ORDER BY scrape_tier, sport
          """)
          rows = cur.fetchall()
          catalog = {(r[0],r[1]): r[2] for r in rows}

          cur.execute("""
              SELECT cc.sport, cc.scrape_tier, COUNT(*) as priced
              FROM market_prices mp
              JOIN card_catalog cc ON cc.id = mp.card_catalog_id
              GROUP BY cc.sport, cc.scrape_tier
              ORDER BY cc.scrape_tier, cc.sport
          """)
          print(f"{'Sport':<6} {'Tier':<9} {'Priced':>8} {'/ Total':>8} {'Pct':>7}")
          print("-"*44)
          for sport, tier, priced in cur.fetchall():
              total = catalog.get((sport,tier), 0)
              pct = priced/total*100 if total else 0
              print(f"{sport:<6} {tier:<9} {priced:>8,} {total:>8,} {pct:>6.1f}%")

          print()
          cur.execute("""
              SELECT cc.scrape_tier,
                COUNT(*) FILTER (WHERE mp.scraped_at < NOW() - INTERVAL '1 day') as stale_1d,
                COUNT(*) FILTER (WHERE mp.scraped_at < NOW() - INTERVAL '7 days') as stale_7d,
                COUNT(*) FILTER (WHERE mp.scraped_at < NOW() - INTERVAL '30 days') as stale_30d
              FROM market_prices mp
              JOIN card_catalog cc ON cc.id = mp.card_catalog_id
              GROUP BY cc.scrape_tier ORDER BY cc.scrape_tier
          """)
          print(f"{'Tier':<9} {'Stale>1d':>10} {'Stale>7d':>10} {'Stale>30d':>10}")
          print("-"*43)
          for tier, s1, s7, s30 in cur.fetchall():
              print(f"{tier:<9} {s1:>10,} {s7:>10,} {s30:>10,}")

          print()
          cur.execute("""
              SELECT
                COUNT(*) FILTER (WHERE mp.scraped_at > NOW() - INTERVAL '1 hour') as h1,
                COUNT(*) FILTER (WHERE mp.scraped_at > NOW() - INTERVAL '24 hours') as h24
              FROM market_prices mp
          """)
          h1, h24 = cur.fetchone()
          print(f"Priced last 1h:   {h1:,}")
          print(f"Priced last 24h:  {h24:,}")
          cur.close(); conn.close()
          PYEOF
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
