name: Quick Stats Check
on:
  workflow_dispatch:
jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run stats
        run: |
          pip install psycopg2-binary -q
          python - << 'PYEOF'
          import os, psycopg2
          url = os.environ["DATABASE_URL"]
          if "proxy.rlwy.net" in url and "sslmode=" not in url:
              url += ("&" if "?" in url else "?") + "sslmode=require"
          conn = psycopg2.connect(url)
          cur = conn.cursor()

          # MLB-specific diagnostics
          print("=== MLB is_rookie counts ===")
          cur.execute("SELECT is_rookie, COUNT(*) FROM card_catalog WHERE sport='MLB' GROUP BY is_rookie ORDER BY is_rookie")
          for r in cur.fetchall(): print(f"  is_rookie={r[0]}: {r[1]:,}")

          print("\n=== Top 20 MLB set_names by count ===")
          cur.execute("SELECT set_name, COUNT(*) as n FROM card_catalog WHERE sport='MLB' GROUP BY set_name ORDER BY n DESC LIMIT 20")
          for r in cur.fetchall(): print(f"  {r[1]:>7,}  {r[0]}")

          print("\n=== MLB set_names with 'Chrome' and is_rookie=TRUE ===")
          cur.execute("SELECT set_name, COUNT(*) FROM card_catalog WHERE sport='MLB' AND set_name ILIKE '%Chrome%' AND is_rookie=TRUE GROUP BY set_name ORDER BY COUNT(*) DESC LIMIT 15")
          for r in cur.fetchall(): print(f"  {r[1]:>6,}  {r[0]}")

          print("\n=== MLB set_names with 'Bowman' and is_rookie=TRUE ===")
          cur.execute("SELECT set_name, COUNT(*) FROM card_catalog WHERE sport='MLB' AND set_name ILIKE '%Bowman%' AND is_rookie=TRUE GROUP BY set_name ORDER BY COUNT(*) DESC LIMIT 15")
          for r in cur.fetchall(): print(f"  {r[1]:>6,}  {r[0]}")

          print("\n=== MLB variants containing '1st' ===")
          cur.execute("SELECT variant, COUNT(*) FROM card_catalog WHERE sport='MLB' AND variant ILIKE '%1st%' GROUP BY variant ORDER BY COUNT(*) DESC LIMIT 15")
          for r in cur.fetchall(): print(f"  {r[1]:>6,}  {r[0]}")

          print("\n=== Top MLB set_names with is_rookie=TRUE ===")
          cur.execute("SELECT set_name, COUNT(*) FROM card_catalog WHERE sport='MLB' AND is_rookie=TRUE GROUP BY set_name ORDER BY COUNT(*) DESC LIMIT 20")
          for r in cur.fetchall(): print(f"  {r[1]:>6,}  {r[0]}")

          print("\n=== Current MLB staple breakdown by set ===")
          cur.execute("SELECT set_name, COUNT(*) FROM card_catalog WHERE sport='MLB' AND scrape_tier='staple' GROUP BY set_name ORDER BY COUNT(*) DESC LIMIT 20")
          for r in cur.fetchall(): print(f"  {r[1]:>6,}  {r[0]}")

          cur.close(); conn.close()
          PYEOF
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Run full stats
        run: |
          pip install psycopg2-binary -q
          python - << 'PYEOF'
          import os, psycopg2
          url = os.environ["DATABASE_URL"]
          if "proxy.rlwy.net" in url and "sslmode=" not in url:
              url += ("&" if "?" in url else "?") + "sslmode=require"
          conn = psycopg2.connect(url)
          cur = conn.cursor()

          cur.execute("""
              SELECT sport, scrape_tier, COUNT(*) as total
              FROM card_catalog
              GROUP BY sport, scrape_tier
              ORDER BY scrape_tier, sport
          """)
          rows = cur.fetchall()
          catalog = {(r[0],r[1]): r[2] for r in rows}

          cur.execute("""
              SELECT cc.sport, cc.scrape_tier, COUNT(*) as priced
              FROM market_prices mp
              JOIN card_catalog cc ON cc.id = mp.card_catalog_id
              GROUP BY cc.sport, cc.scrape_tier
              ORDER BY cc.scrape_tier, cc.sport
          """)
          print(f"{'Sport':<6} {'Tier':<9} {'Priced':>8} {'/ Total':>8} {'Pct':>7}")
          print("-"*44)
          for sport, tier, priced in cur.fetchall():
              total = catalog.get((sport,tier), 0)
              pct = priced/total*100 if total else 0
              print(f"{sport:<6} {tier:<9} {priced:>8,} {total:>8,} {pct:>6.1f}%")

          print()
          cur.execute("""
              SELECT cc.scrape_tier,
                COUNT(*) FILTER (WHERE mp.scraped_at < NOW() - INTERVAL '1 day') as stale_1d,
                COUNT(*) FILTER (WHERE mp.scraped_at < NOW() - INTERVAL '7 days') as stale_7d,
                COUNT(*) FILTER (WHERE mp.scraped_at < NOW() - INTERVAL '30 days') as stale_30d
              FROM market_prices mp
              JOIN card_catalog cc ON cc.id = mp.card_catalog_id
              GROUP BY cc.scrape_tier ORDER BY cc.scrape_tier
          """)
          print(f"{'Tier':<9} {'Stale>1d':>10} {'Stale>7d':>10} {'Stale>30d':>10}")
          print("-"*43)
          for tier, s1, s7, s30 in cur.fetchall():
              print(f"{tier:<9} {s1:>10,} {s7:>10,} {s30:>10,}")

          print()
          cur.execute("""
              SELECT
                COUNT(*) FILTER (WHERE mp.scraped_at > NOW() - INTERVAL '1 hour') as h1,
                COUNT(*) FILTER (WHERE mp.scraped_at > NOW() - INTERVAL '24 hours') as h24
              FROM market_prices mp
          """)
          h1, h24 = cur.fetchone()
          print(f"Priced last 1h:   {h1:,}")
          print(f"Priced last 24h:  {h24:,}")

          print()
          cur.execute("""
              SELECT cc.scrape_tier, cc.sport,
                COUNT(*) FILTER (WHERE mp.scraped_at > NOW() - INTERVAL '1 hour') as h1,
                COUNT(*) FILTER (WHERE mp.scraped_at > NOW() - INTERVAL '6 hours') as h6,
                COUNT(*) FILTER (WHERE mp.scraped_at > NOW() - INTERVAL '24 hours') as h24
              FROM market_prices mp
              JOIN card_catalog cc ON cc.id = mp.card_catalog_id
              GROUP BY cc.scrape_tier, cc.sport
              HAVING COUNT(*) FILTER (WHERE mp.scraped_at > NOW() - INTERVAL '24 hours') > 0
              ORDER BY cc.scrape_tier, cc.sport
          """)
          rows = cur.fetchall()
          if rows:
              print(f"{'Tier':<9} {'Sport':<6} {'Last 1h':>9} {'Last 6h':>9} {'Last 24h':>10}")
              print("-"*48)
              for tier, sport, h1t, h6t, h24t in rows:
                  print(f"{tier:<9} {sport:<6} {h1t:>9,} {h6t:>9,} {h24t:>10,}")
          else:
              print("No scrape activity in last 24 hours")

          print()
          cur.execute("""
              SELECT workflow, sport, tier, mode,
                     cards_processed, cards_found,
                     started_at AT TIME ZONE 'UTC' as started_at
              FROM scrape_runs
              WHERE started_at > NOW() - INTERVAL '6 hours'
              ORDER BY started_at DESC
              LIMIT 20
          """)
          runs = cur.fetchall()
          if runs:
              print(f"{'Workflow':<30} {'Sport':<6} {'Tier':<9} {'Checked':>8} {'Found':>7} {'Started (UTC)':>20}")
              print("-"*84)
              for wf, sport, tier, mode, checked, found, started in runs:
                  wf_short = (wf or 'manual')[:28]
                  print(f"{wf_short:<30} {(sport or '-'):<6} {(tier or '-'):<9} {(checked or 0):>8,} {(found or 0):>7,} {str(started)[:19]:>20}")
          else:
              print("No scrape runs in last 6 hours")
          cur.close(); conn.close()
          PYEOF
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
