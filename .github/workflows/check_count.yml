name: Check live price count
on:
  workflow_dispatch:
jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Get live count
        run: |
          pip install psycopg2-binary -q
          python - << 'PYEOF'
          import os, psycopg2
          conn = psycopg2.connect(os.environ["DATABASE_URL"])
          cur = conn.cursor()
          cur.execute("""
            SELECT
              COUNT(*) as total_priced,
              COUNT(*) FILTER (WHERE scraped_at > NOW() - INTERVAL '6 hours') as last_6h,
              COUNT(*) FILTER (WHERE scraped_at < NOW() - INTERVAL '90 days') as older_90d
            FROM market_prices
          """)
          total, last_6h, old_90d = cur.fetchone()
          print(f"market_prices:")
          print(f"  Total:          {total:,}")
          print(f"  Last 6 hours:   {last_6h:,}")
          print(f"  Older than 90d: {old_90d:,}")

          cur.execute("""
            SELECT
              MIN(sold_date) as oldest_sale,
              MAX(sold_date) as newest_sale,
              COUNT(*) FILTER (WHERE sold_date < NOW() - INTERVAL '90 days') as older_90d
            FROM market_raw_sales
          """)
          oldest, newest, old_sales = cur.fetchone()
          print(f"market_raw_sales:")
          print(f"  Oldest sold_date: {oldest}")
          print(f"  Newest sold_date: {newest}")
          print(f"  Older than 90d:   {old_sales:,}")
          cur.close(); conn.close()
          PYEOF
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
