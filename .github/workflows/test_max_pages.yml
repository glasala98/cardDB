name: Test max-pages (5 vs 15)

on:
  workflow_dispatch:

jobs:
  test-5-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install psycopg2-binary requests beautifulsoup4 curl_cffi lxml
      - name: Scrape NHL premium shard 0 — max-pages 5
        run: |
          python -u scraping/scrape_master_db.py \
            --catalog-tier premium \
            --sport NHL \
            --workers 4 \
            --stale-days 1 \
            --max-pages 5 \
            --limit 500 \
            --force
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  test-15-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install psycopg2-binary requests beautifulsoup4 curl_cffi lxml
      - name: Scrape NHL premium shard 0 — max-pages 15 (baseline)
        run: |
          python -u scraping/scrape_master_db.py \
            --catalog-tier premium \
            --sport NHL \
            --workers 4 \
            --stale-days 1 \
            --max-pages 15 \
            --limit 500 \
            --force
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
