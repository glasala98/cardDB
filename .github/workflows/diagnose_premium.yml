name: Diagnose Premium Backfill (Manual)

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install psycopg2-binary -q
      - name: Premium diagnosis
        run: |
          python - <<'EOF'
          import os, psycopg2
          conn = psycopg2.connect(os.environ["DATABASE_URL"])
          cur = conn.cursor()

          # How many premium cards have raw_sales vs priced vs neither
          cur.execute("""
              SELECT
                  COUNT(*) as total,
                  COUNT(CASE WHEN rs.cnt > 0 THEN 1 END) as has_raw_sales,
                  COUNT(CASE WHEN mp.fair_value > 0 THEN 1 END) as has_fair_value,
                  COUNT(CASE WHEN rs.cnt = 0 AND mp.id IS NULL THEN 1 END) as untouched,
                  COUNT(CASE WHEN mp.confidence = 'no_market' THEN 1 END) as no_market
              FROM card_catalog cc
              LEFT JOIN market_prices mp ON mp.card_catalog_id = cc.id
              LEFT JOIN (
                  SELECT card_catalog_id, COUNT(*) as cnt
                  FROM market_raw_sales
                  GROUP BY card_catalog_id
              ) rs ON rs.card_catalog_id = cc.id
              WHERE cc.scrape_tier = 'premium'
          """)
          r = cur.fetchone()
          print(f"\nPremium tier breakdown:")
          print(f"  Total cards:       {r[0]:,}")
          print(f"  Has raw_sales:     {r[1]:,}  ({r[1]/r[0]*100:.1f}%)")
          print(f"  Has fair_value:    {r[2]:,}  ({r[2]/r[0]*100:.1f}%)")
          print(f"  Untouched:         {r[3]:,}  ({r[3]/r[0]*100:.1f}%) ← backfill target")
          print(f"  no_market:         {r[4]:,}  ({r[4]/r[0]*100:.1f}%)")

          # Breakdown by sport
          cur.execute("""
              SELECT cc.sport,
                  COUNT(*) as total,
                  COUNT(CASE WHEN rs.cnt > 0 THEN 1 END) as has_raw_sales,
                  COUNT(CASE WHEN mp.fair_value > 0 THEN 1 END) as priced,
                  COUNT(CASE WHEN rs.cnt = 0 AND mp.id IS NULL THEN 1 END) as untouched
              FROM card_catalog cc
              LEFT JOIN market_prices mp ON mp.card_catalog_id = cc.id
              LEFT JOIN (
                  SELECT card_catalog_id, COUNT(*) as cnt
                  FROM market_raw_sales GROUP BY card_catalog_id
              ) rs ON rs.card_catalog_id = cc.id
              WHERE cc.scrape_tier = 'premium'
              GROUP BY cc.sport ORDER BY cc.sport
          """)
          print(f"\n{'Sport':<6} {'Total':>8} {'Raw Sales':>10} {'Priced':>8} {'Untouched':>10}")
          print("-" * 46)
          for row in cur.fetchall():
              print(f"{row[0]:<6} {row[1]:>8,} {row[2]:>10,} {row[3]:>8,} {row[4]:>10,}")

          conn.close()
          EOF
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
