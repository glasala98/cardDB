name: Elite Tier — 6h Scrape

# Elite = score ≥100 (S-tier player + apex/scarce card + flagship set).
# These are the most valuable and most volatile cards — repriced every 6h.
# stale-days 1 ensures we reprice anything older than 24h each run.
#
# Connection budget: 4 sports × 1 flush-conn = 4 peak connections ✅

on:
  schedule:
    - cron: '0 0,6,12,18 * * *'  # 00:00, 06:00, 12:00, 18:00 UTC
  workflow_dispatch:
    inputs:
      sport:
        description: 'Sport to scrape (NHL/NBA/NFL/MLB — blank = all)'
        required: false
        default: ''
      limit:
        description: 'Max cards per sport (0=all)'
        required: false
        default: '0'

concurrency:
  group: catalog-tier-elite
  cancel-in-progress: true

jobs:
  scrape-nhl:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    if: ${{ github.event.inputs.sport == '' || github.event.inputs.sport == 'NHL' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Chrome
        run: |
          wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y /tmp/chrome.deb || sudo apt-get -f install -y
      - name: Install Python dependencies
        run: pip install -r requirements.txt webdriver-manager scipy
      - name: Scrape NHL elite prices
        run: python -u scraping/scrape_master_db.py --catalog-tier elite --sport NHL --workers 5 --stale-days 1 --max-hours 5.75 --limit ${{ github.event.inputs.limit || '0' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  scrape-nba:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    if: ${{ github.event.inputs.sport == '' || github.event.inputs.sport == 'NBA' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Chrome
        run: |
          wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y /tmp/chrome.deb || sudo apt-get -f install -y
      - name: Install Python dependencies
        run: pip install -r requirements.txt webdriver-manager scipy
      - name: Scrape NBA elite prices
        run: python -u scraping/scrape_master_db.py --catalog-tier elite --sport NBA --workers 5 --stale-days 1 --max-hours 5.75 --limit ${{ github.event.inputs.limit || '0' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  scrape-nfl:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    if: ${{ github.event.inputs.sport == '' || github.event.inputs.sport == 'NFL' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Chrome
        run: |
          wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y /tmp/chrome.deb || sudo apt-get -f install -y
      - name: Install Python dependencies
        run: pip install -r requirements.txt webdriver-manager scipy
      - name: Scrape NFL elite prices
        run: python -u scraping/scrape_master_db.py --catalog-tier elite --sport NFL --workers 5 --stale-days 1 --max-hours 5.75 --limit ${{ github.event.inputs.limit || '0' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  scrape-mlb:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    if: ${{ github.event.inputs.sport == '' || github.event.inputs.sport == 'MLB' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Chrome
        run: |
          wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
