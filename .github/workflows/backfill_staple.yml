name: Staple Tier — Delta Scrape

# Delta mode: reprices all staple cards not seen in the last 1 day.
# Staple backfill is complete — this is now a recurring delta workflow.
# Sharded across 20 parallel runners (4×NHL, 4×NBA, 8×NFL, 4×MLB) for throughput.
# Each shard should clear in well under 5.75h at delta volume.
#
# Connection budget: 20 shards × 1 flush-conn = 20 peak ✅
# Time limit: 5.75h graceful stop (GH Actions hard-kills at 6h)

concurrency:
  group: backfill-staple
  cancel-in-progress: false

on:
  schedule:
    - cron: '0 6 * * *'   # daily 6am UTC — between stars (ends ~05:45) and premium (starts 10am)
  workflow_dispatch:
    inputs:
      sport:
        description: 'Sport to backfill (NHL/NBA/NFL/MLB, blank=all)'
        required: false
        default: ''

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 370
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include:
          # NHL — 4 shards (~650 cards each, ~75min)
          - { sport: NHL, shard_index: 0, shard_count: 4 }
          - { sport: NHL, shard_index: 1, shard_count: 4 }
          - { sport: NHL, shard_index: 2, shard_count: 4 }
          - { sport: NHL, shard_index: 3, shard_count: 4 }
          # NBA — 4 shards (~1,450 cards each, ~220min)
          - { sport: NBA, shard_index: 0, shard_count: 4 }
          - { sport: NBA, shard_index: 1, shard_count: 4 }
          - { sport: NBA, shard_index: 2, shard_count: 4 }
          - { sport: NBA, shard_index: 3, shard_count: 4 }
          # NFL — 8 shards (~1,350 cards each, ~180min) — was 4 shards, hit 6h kill
          - { sport: NFL, shard_index: 0, shard_count: 8 }
          - { sport: NFL, shard_index: 1, shard_count: 8 }
          - { sport: NFL, shard_index: 2, shard_count: 8 }
          - { sport: NFL, shard_index: 3, shard_count: 8 }
          - { sport: NFL, shard_index: 4, shard_count: 8 }
          - { sport: NFL, shard_index: 5, shard_count: 8 }
          - { sport: NFL, shard_index: 6, shard_count: 8 }
          - { sport: NFL, shard_index: 7, shard_count: 8 }
          # MLB — 4 shards (~1,150 cards each, ~160min)
          - { sport: MLB, shard_index: 0, shard_count: 4 }
          - { sport: MLB, shard_index: 1, shard_count: 4 }
          - { sport: MLB, shard_index: 2, shard_count: 4 }
          - { sport: MLB, shard_index: 3, shard_count: 4 }

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'


      - name: Install dependencies
        run: pip install -r requirements.txt scipy

      - name: Scrape ${{ matrix.sport }} staple delta (shard ${{ matrix.shard_index }}/${{ matrix.shard_count }})
        if: ${{ github.event.inputs.sport == '' || github.event.inputs.sport == matrix.sport || github.event_name == 'schedule' }}
        run: |
          python -u scraping/scrape_master_db.py \
            --catalog-tier staple \
            --sport ${{ matrix.sport }} \
            --workers 2 \
            --stale-days 1 \
            --year-from 2000 \
            --shard-index ${{ matrix.shard_index }} \
            --shard-count ${{ matrix.shard_count }} \
            --max-hours 5.75
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
