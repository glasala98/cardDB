name: Backfill — Staple (90-day history)

# Runs every 6h so it auto-restarts after the 5.75h graceful stop.
# Skips already-scraped cards automatically — safe to run forever until done.
# Workers reduced to 2 for stability on 2-core GH Actions VMs.
#
# Connection budget: 4 sports × pool-max 5 = 20 connections ✅
# Time limit: 5.75h graceful stop (GH Actions hard-kills at 6h)

concurrency:
  group: backfill-staple
  cancel-in-progress: false

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6h: 00:00, 06:00, 12:00, 18:00 UTC
  workflow_dispatch:
    inputs:
      sport:
        description: 'Sport to backfill (NHL/NBA/NFL/MLB, blank=all)'
        required: false
        default: ''

jobs:
  backfill-nhl:
    if: ${{ github.event.inputs.sport == '' || github.event.inputs.sport == 'NHL' || github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 370
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Chrome
        run: |
          wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y /tmp/chrome.deb || sudo apt-get -f install -y
      - name: Install dependencies
        run: pip install -r requirements.txt webdriver-manager scipy
      - name: Backfill NHL staple
        run: |
          python -u scraping/scrape_master_db.py \
            --catalog-tier staple --sport NHL \
            --workers 2 --stale-days 60 --year-from 2000 \
            --backfill --max-hours 5.75
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  backfill-nba:
