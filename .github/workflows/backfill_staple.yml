            --workers 3 --stale-days 60 --year-from 2000 \
            --backfill --max-hours 5.75 \
            --limit ${{ github.event.inputs.limit || '0' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  backfill-mlb:
    if: ${{ github.event.inputs.sport == '' || github.event.inputs.sport == 'MLB' }}
    runs-on: ubuntu-latest
    timeout-minutes: 370
