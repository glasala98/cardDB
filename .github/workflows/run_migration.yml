name: Run migration
on:
  workflow_dispatch:
    inputs:
      migration:
        description: 'Migration file to run (e.g. migrate_add_raw_sales_condition)'
        required: true
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install psycopg2-binary
      - run: python migrations/${{ github.event.inputs.migration }}.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
