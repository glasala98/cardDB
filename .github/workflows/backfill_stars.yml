name: Backfill — Stars (90-day history)

# One-time backfill: captures full 90-day eBay sold history for stars-tier cards.
# NFL has ~23k unscraped cards — takes ~2 runs of 5.75h each to fully cover.
# Re-run daily until complete. Picks up where it left off (skips cards with raw_sales).
#
# Connection budget: 4 sports × pool-max 5 = 20 connections ✅

concurrency:
  group: backfill-stars
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      sport:
        description: 'Sport to backfill (NHL/NBA/NFL/MLB, blank=all)'
        required: false
        default: ''
      limit:
        description: 'Max cards per sport (0=all, use for smoke test)'
        required: false
        default: '0'

jobs:
  backfill-nhl:
    if: ${{ github.event.inputs.sport == '' || github.event.inputs.sport == 'NHL' }}
    runs-on: ubuntu-latest
    timeout-minutes: 370
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Chrome
        run: |
          wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y /tmp/chrome.deb || sudo apt-get -f install -y
      - name: Install dependencies
        run: pip install -r requirements.txt webdriver-manager scipy
      - name: Backfill NHL stars
        run: |
          python -u scraping/scrape_master_db.py \
            --catalog-tier stars --sport NHL \
            --workers 3 --stale-days 60 \
            --backfill --max-hours 5.75 \
            --limit ${{ github.event.inputs.limit || '0' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  backfill-nba:
    if: ${{ github.event.inputs.sport == '' || github.event.inputs.sport == 'NBA' }}
    runs-on: ubuntu-latest
    timeout-minutes: 370
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
