name: Stars Tier — Delta Scrape

# Delta mode: all stars tier cards have been touched (Untouched=0 confirmed Apr 8).
# --backfill removed — was finding 0 cards. Now runs delta with stale-days 60
# to reprice cards not scraped in 60 days.
# 20 shards across 4 sports, max-parallel 20 (GH limit).

concurrency:
  group: backfill-stars
  cancel-in-progress: false

on:
  schedule:
    - cron: '0 3,9,15,21 * * *'  # every 6h — offset 3h from elite, 1h from premium
  workflow_dispatch:
    inputs:
      sport:
        description: 'Sport to backfill (NHL/NBA/NFL/MLB, blank=all)'
        required: false
        default: ''

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 370
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include:
          # NHL — 4 shards
          - { sport: NHL, shard_index: 0, shard_count: 4 }
          - { sport: NHL, shard_index: 1, shard_count: 4 }
          - { sport: NHL, shard_index: 2, shard_count: 4 }
          - { sport: NHL, shard_index: 3, shard_count: 4 }
          # NBA — 4 shards
          - { sport: NBA, shard_index: 0, shard_count: 4 }
          - { sport: NBA, shard_index: 1, shard_count: 4 }
          - { sport: NBA, shard_index: 2, shard_count: 4 }
          - { sport: NBA, shard_index: 3, shard_count: 4 }
          # NFL — 8 shards (largest sport in stars)
          - { sport: NFL, shard_index: 0, shard_count: 8 }
          - { sport: NFL, shard_index: 1, shard_count: 8 }
          - { sport: NFL, shard_index: 2, shard_count: 8 }
          - { sport: NFL, shard_index: 3, shard_count: 8 }
          - { sport: NFL, shard_index: 4, shard_count: 8 }
          - { sport: NFL, shard_index: 5, shard_count: 8 }
          - { sport: NFL, shard_index: 6, shard_count: 8 }
          - { sport: NFL, shard_index: 7, shard_count: 8 }
          # MLB — 4 shards
          - { sport: MLB, shard_index: 0, shard_count: 4 }
          - { sport: MLB, shard_index: 1, shard_count: 4 }
          - { sport: MLB, shard_index: 2, shard_count: 4 }
          - { sport: MLB, shard_index: 3, shard_count: 4 }

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Chrome
        run: |
          wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y /tmp/chrome.deb || sudo apt-get -f install -y

      - name: Install dependencies
        run: pip install -r requirements.txt webdriver-manager scipy

      - name: Scrape ${{ matrix.sport }} stars delta (shard ${{ matrix.shard_index }}/${{ matrix.shard_count }})
        if: ${{ github.event.inputs.sport == '' || github.event.inputs.sport == matrix.sport }}
        run: |
          python -u scraping/scrape_master_db.py \
            --catalog-tier stars \
            --sport ${{ matrix.sport }} \
            --workers 2 \
            --stale-days 60 \
            --year-from 2000 \
            --shard-index ${{ matrix.shard_index }} \
            --shard-count ${{ matrix.shard_count }} \
            --max-hours 5.75
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  notify:
    runs-on: ubuntu-latest
    needs: backfill
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install psycopg2-binary
      - name: Build progress report
        id: report
        run: |
          python - <<'EOF'
          import os, psycopg2, hashlib

          conn = psycopg2.connect(os.environ["DATABASE_URL"])
          cur = conn.cursor()

          cur.execute("""
              SELECT cc.sport,
                     COUNT(DISTINCT mp.card_catalog_id) AS priced,
                     COUNT(DISTINCT cc.id)              AS total
              FROM card_catalog cc
              LEFT JOIN market_prices mp ON mp.card_catalog_id = cc.id AND mp.fair_value > 0
              WHERE cc.scrape_tier = 'stars'
              GROUP BY cc.sport ORDER BY cc.sport
          """)
          rows = cur.fetchall()
          conn.close()

          lines = []
          grand_done = grand_total = 0
          for sport, done, total in rows:
              pct = done / total * 100 if total else 0
              bar = "█" * int(pct // 10) + "░" * (10 - int(pct // 10))
              lines.append(f"{sport:<4}  {bar}  {pct:5.1f}%  {done:,}/{total:,}")
              grand_done += done; grand_total += total

          grand_pct = grand_done / grand_total * 100 if grand_total else 0
          summary = "\n".join(lines)
          summary += f"\n\nTotal: {grand_done:,}/{grand_total:,} ({grand_pct:.1f}%)"

          subject = f"📊 CardDB — Stars backfill {grand_pct:.1f}% complete"
          repo = os.environ.get("GITHUB_REPOSITORY", "")
          run_id = os.environ.get("GITHUB_RUN_ID", "")
          body = f"Stars backfill run complete\n\n{summary}\n\nRun: https://github.com/{repo}/actions/runs/{run_id}"

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              delim = "EOF_" + hashlib.md5(body.encode()).hexdigest()[:8]
              f.write(f"body<<{delim}\n{body}\n{delim}\n")
              f.write(f"subject={subject}\n")
          EOF
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
      - name: Send email
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.NOTIFY_GMAIL_USER }}
          password: ${{ secrets.NOTIFY_GMAIL_APP_PASSWORD }}
          to: ${{ secrets.NOTIFY_EMAIL_TO }}
          from: "CardDB Monitor <${{ secrets.NOTIFY_GMAIL_USER }}>"
          subject: ${{ steps.report.outputs.subject }}
          body: ${{ steps.report.outputs.body }}
