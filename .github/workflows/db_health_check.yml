name: DB Health Check (Daily)

# Runs every morning before the scrape workflows.
# Fails loudly if DB exceeds the fail threshold, creating a visible red X
# on the Actions tab before the expensive jobs even start.

on:
  schedule:
    - cron: '0 5 * * *'  # 5am UTC — 1hr before scrapes at 6am
  workflow_dispatch:
    inputs:
      reclassify_all:
        description: 'Reclassify ALL cards from scratch (use after adding new tier rules)'
        required: false
        default: 'false'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install psycopg2-binary python-dotenv
      - name: Check DB disk usage
        run: python scripts/preflight_db_check.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Clean known data quality issues
        run: |
          python - <<'EOF'
          import os, psycopg2
          conn = psycopg2.connect(os.environ["DATABASE_URL"])
          cur = conn.cursor()
          cur.execute("""
              DELETE FROM market_raw_sales
              WHERE title ILIKE '%opens in a new window%'
                 OR title ILIKE '%new window or tab%'
          """)
          if cur.rowcount:
              print(f"  Deleted {cur.rowcount} eBay boilerplate rows from market_raw_sales")
          conn.commit(); conn.close()
          EOF
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Assign/refresh catalog tiers
        run: |
          if [ "${{ github.event.inputs.reclassify_all }}" = "true" ]; then
            python scripts/assign_catalog_tiers.py --all
          else
            python scripts/assign_catalog_tiers.py
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
