name: Ledger Scrape — Personal Portfolio (Daily)

# Prices every card in the personal collection with recent eBay sold comps and
# pushes the results to the site over its admin API (see
# scraping/portfolio_price_push.py for why it is done from a runner).
# Dispatched on demand by the site's "trigger scrape" button (POST
# /api/stats/trigger-scrape) and on a daily schedule.

concurrency:
  group: ledger-scrape
  cancel-in-progress: true

on:
  schedule:
    - cron: '0 8 * * *'   # 8am UTC daily (3am EST)
  workflow_dispatch:
    inputs:
      workers:
        description: 'Parallel scrape workers'
        required: false
        default: '3'
      limit:
        description: 'Only price the first N cards (0 = all)'
        required: false
        default: '0'

jobs:
  ledger-scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: pip install -r requirements.txt scipy
      - name: Price the portfolio and push to the site
        env:
          CARDDB_URL:      ${{ secrets.CARDDB_URL }}
          CARDDB_USER:     ${{ secrets.CARDDB_USER }}
          CARDDB_PASSWORD: ${{ secrets.CARDDB_PASSWORD }}
        run: python -u scraping/portfolio_price_push.py --workers "${{ github.event.inputs.workers || '3' }}" --limit "${{ github.event.inputs.limit || '0' }}"
