name: DB Backup — Delta (after each scrape)

# Exports only rows added since the last 25 hours from the two append-only tables:
#   - market_raw_sales  (irreplaceable eBay sold listings)
#   - market_price_history  (daily price snapshots)
#
# Triggered automatically after any scraper workflow completes.
# Also manually triggerable via workflow_dispatch.
#
# Artifact format: gzipped CSV, retained 30 days.
# To restore: gunzip delta_*.csv.gz then COPY table FROM 'file.csv' CSV HEADER

on:
  workflow_run:
    workflows:
      - "Catalog — Base Tier Scraper"
      - "Catalog — Staple Tier"
      - "Catalog — Premium Tier"
      - "Catalog — Stars Tier"
      - "Catalog — Graded Prices (Staple + Premium + Stars)"
      - "Master DB — Daily Scrape"
      - "Master DB — Weekly Rookie Sweep"
    types: [completed]
  workflow_dispatch:

jobs:
  delta-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -q
          sudo apt-get install -y postgresql-client

      - name: Export delta — market_raw_sales (last 25h)
        run: |
          psql "$DATABASE_URL" -c "\COPY (
            SELECT * FROM market_raw_sales
            WHERE created_at >= NOW() - INTERVAL '25 hours'
            ORDER BY created_at
          ) TO STDOUT CSV HEADER" | gzip > delta_raw_sales_$(date +%Y-%m-%dT%H-%M).csv.gz
          echo "Rows exported: $(zcat delta_raw_sales_*.csv.gz | tail -n +2 | wc -l)"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Export delta — market_price_history (last 25h)
        run: |
          psql "$DATABASE_URL" -c "\COPY (
            SELECT * FROM market_price_history
            WHERE scraped_at >= NOW() - INTERVAL '25 hours'
            ORDER BY scraped_at
          ) TO STDOUT CSV HEADER" | gzip > delta_price_history_$(date +%Y-%m-%dT%H-%M).csv.gz
          echo "Rows exported: $(zcat delta_price_history_*.csv.gz | tail -n +2 | wc -l)"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Upload delta artifacts
        uses: actions/upload-artifact@v4
        with:
          name: delta-${{ github.run_number }}-${{ github.run_id }}
          path: delta_*.csv.gz
          retention-days: 30
          if-no-files-found: error
