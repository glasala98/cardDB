name: Catalog Tier — Premium (Daily)

# Premium = 22% complete, 417K cards remaining — highest priority.
# SHARDED: 2 shards per sport = 8 parallel runners per trigger.
# Each shard finishes in ~2-2.5h vs 4.5h unsharded → run 6x/day without overlap.
#
# Connection budget: 8 jobs × 5 workers = 40 connections per run.
# Worst case with staple+stars: 40 + 20 + 20 + 5(app) = 85 — under Railway limit of 100 ✅
# Expected ETA with 6x/day sharded: ~Apr 8 (down from ~Apr 22 unsharded)

on:
  schedule:
    - cron: '0 0 * * *'   # midnight UTC
    - cron: '0 4 * * *'   # 4am UTC
    - cron: '0 8 * * *'   # 8am UTC
    - cron: '0 12 * * *'  # noon UTC
    - cron: '0 16 * * *'  # 4pm UTC
    - cron: '0 20 * * *'  # 8pm UTC
  workflow_dispatch:
    inputs:
      sport:
        description: 'Sport (NHL/NBA/NFL/MLB, blank=all)'
        required: false
        default: ''
      limit:
        description: 'Max cards per shard (0=all)'
        required: false
        default: '0'

jobs:
  notify-start:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: dawidd6/action-send-mail@v3
        continue-on-error: true
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.NOTIFY_GMAIL_USER }}
          password: ${{ secrets.NOTIFY_GMAIL_APP_PASSWORD }}
          to: ${{ secrets.NOTIFY_EMAIL_TO }}
          from: "CardDB Monitor <${{ secrets.NOTIFY_GMAIL_USER }}>"
          subject: "▶️ CardDB — Premium scrape started (8 shards)"
          body: |
            Premium-tier scrape has started (2 shards × 4 sports = 8 parallel runners).

            Triggered by: ${{ github.event_name }}
            Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

  scrape:
    needs: notify-start
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          # NHL — 2 shards
          - { sport: NHL, shard_index: 0, shard_count: 2 }
          - { sport: NHL, shard_index: 1, shard_count: 2 }
          # NBA — 2 shards
          - { sport: NBA, shard_index: 0, shard_count: 2 }
          - { sport: NBA, shard_index: 1, shard_count: 2 }
          # NFL — 2 shards
          - { sport: NFL, shard_index: 0, shard_count: 2 }
          - { sport: NFL, shard_index: 1, shard_count: 2 }
          # MLB — 2 shards
          - { sport: MLB, shard_index: 0, shard_count: 2 }
          - { sport: MLB, shard_index: 1, shard_count: 2 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Chrome
        run: |
          wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y /tmp/chrome.deb || sudo apt-get -f install -y
      - name: Install Python dependencies
        run: pip install -r requirements.txt webdriver-manager scipy
      - name: Scrape ${{ matrix.sport }} premium (shard ${{ matrix.shard_index }}/${{ matrix.shard_count }})
        if: ${{ github.event.inputs.sport == '' || github.event.inputs.sport == matrix.sport }}
        run: |
          python -u scraping/scrape_master_db.py \
            --catalog-tier premium \
            --sport ${{ matrix.sport }} \
            --workers 5 \
            --stale-days 7 \
            --shard-index ${{ matrix.shard_index }} \
            --shard-count ${{ matrix.shard_count }} \
            --max-hours 4.5 \
            --limit ${{ github.event.inputs.limit || '0' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  notify-done:
    needs: scrape
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: dawidd6/action-send-mail@v3
        continue-on-error: true
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.NOTIFY_GMAIL_USER }}
          password: ${{ secrets.NOTIFY_GMAIL_APP_PASSWORD }}
          to: ${{ secrets.NOTIFY_EMAIL_TO }}
          from: "CardDB Monitor <${{ secrets.NOTIFY_GMAIL_USER }}>"
          subject: "✅ CardDB — Premium scrape done (8 shards)"
          body: |
            Premium-tier sharded scrape has completed.

            Result: ${{ needs.scrape.result }}

            Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
