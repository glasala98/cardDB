name: Catalog Tier — Premium (Daily)

# Premium = high-value cards, 22% complete with 417K remaining — highest ROI after staple.
# Runs 4x/day. With base paused: premium(20) + staple(20) + stars(20) + app(5) = 65 max ✅

on:
  schedule:
    - cron: '0 2 * * *'   # 2am  UTC
    - cron: '0 10 * * *'  # 10am UTC
    - cron: '0 18 * * *'  # 6pm  UTC
    - cron: '0 22 * * *'  # 10pm UTC
  workflow_dispatch:
    inputs:
      sport:
        description: 'Sport (NHL/NBA/NFL/MLB, blank=all)'
        required: false
        default: ''
      limit:
        description: 'Max cards per sport (0=all)'
        required: false
        default: '0'

jobs:
  notify-start:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: dawidd6/action-send-mail@v3
        continue-on-error: true
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.NOTIFY_GMAIL_USER }}
          password: ${{ secrets.NOTIFY_GMAIL_APP_PASSWORD }}
          to: ${{ secrets.NOTIFY_EMAIL_TO }}
          from: "CardDB Monitor <${{ secrets.NOTIFY_GMAIL_USER }}>"
          subject: "▶️ CardDB — Premium scrape started (NHL/NBA/NFL/MLB)"
          body: |
            Premium-tier scrape has started across all 4 sports (parallel).

            Triggered by: ${{ github.event_name }}
            Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

  scrape-premium-nhl:
    needs: notify-start
    runs-on: ubuntu-latest
    timeout-minutes: 300
    if: ${{ github.event.inputs.sport == '' || github.event.inputs.sport == 'NHL' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Chrome
        run: |
          wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y /tmp/chrome.deb || sudo apt-get -f install -y
      - name: Install Python dependencies
        run: pip install -r requirements.txt webdriver-manager scipy
      - name: Scrape NHL premium prices
        run: python -u scraping/scrape_master_db.py --catalog-tier premium --sport NHL --workers 5 --stale-days 7 --max-hours 4.5 --limit ${{ github.event.inputs.limit || '0' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  scrape-premium-nba:
    needs: notify-start
    runs-on: ubuntu-latest
    timeout-minutes: 300
    if: ${{ github.event.inputs.sport == '' || github.event.inputs.sport == 'NBA' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Chrome
        run: |
          wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y /tmp/chrome.deb || sudo apt-get -f install -y
      - name: Install Python dependencies
        run: pip install -r requirements.txt webdriver-manager scipy
      - name: Scrape NBA premium prices
        run: python -u scraping/scrape_master_db.py --catalog-tier premium --sport NBA --workers 5 --stale-days 7 --max-hours 4.5 --limit ${{ github.event.inputs.limit || '0' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  scrape-premium-nfl:
    needs: notify-start
    runs-on: ubuntu-latest
    timeout-minutes: 300
    if: ${{ github.event.inputs.sport == '' || github.event.inputs.sport == 'NFL' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Chrome
        run: |
          wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y /tmp/chrome.deb || sudo apt-get -f install -y
      - name: Install Python dependencies
        run: pip install -r requirements.txt webdriver-manager scipy
      - name: Scrape NFL premium prices
        run: python -u scraping/scrape_master_db.py --catalog-tier premium --sport NFL --workers 5 --stale-days 7 --max-hours 4.5 --limit ${{ github.event.inputs.limit || '0' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  scrape-premium-mlb:
    needs: notify-start
    runs-on: ubuntu-latest
    timeout-minutes: 300
    if: ${{ github.event.inputs.sport == '' || github.event.inputs.sport == 'MLB' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Chrome
        run: |
          wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y /tmp/chrome.deb || sudo apt-get -f install -y
      - name: Install Python dependencies
        run: pip install -r requirements.txt webdriver-manager scipy
      - name: Scrape MLB premium prices
        run: python -u scraping/scrape_master_db.py --catalog-tier premium --sport MLB --workers 5 --stale-days 7 --max-hours 4.5 --limit ${{ github.event.inputs.limit || '0' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  notify-done:
    needs: [scrape-premium-nhl, scrape-premium-nba, scrape-premium-nfl, scrape-premium-mlb]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: dawidd6/action-send-mail@v3
        continue-on-error: true
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.NOTIFY_GMAIL_USER }}
          password: ${{ secrets.NOTIFY_GMAIL_APP_PASSWORD }}
          to: ${{ secrets.NOTIFY_EMAIL_TO }}
          from: "CardDB Monitor <${{ secrets.NOTIFY_GMAIL_USER }}>"
          subject: "✅ CardDB — Premium scrape done (NHL/NBA/NFL/MLB)"
          body: |
            Premium-tier scrape has completed.

            NHL: ${{ needs.scrape-premium-nhl.result }}
            NBA: ${{ needs.scrape-premium-nba.result }}
            NFL: ${{ needs.scrape-premium-nfl.result }}
            MLB: ${{ needs.scrape-premium-mlb.result }}

            Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
