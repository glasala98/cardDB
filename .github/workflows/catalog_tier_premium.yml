name: Catalog Tier — Premium (Hourly)

# Premium tier — 2 shards per sport = 8 parallel runners per trigger.
# stale-days 7 so most triggers exit quickly once backfill is complete.
# Connection budget: 8 flush-conns peak, well under Railway limit ✅

concurrency:
  group: catalog-tier-premium
  cancel-in-progress: true

on:
  schedule:
    - cron: '0 * * * *'   # hourly
  workflow_dispatch:
    inputs:
      sport:
        description: 'Sport (NHL/NBA/NFL/MLB, blank=all)'
        required: false
        default: ''
      limit:
        description: 'Max cards per shard (0=all)'
        required: false
        default: '0'

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          # NHL — 2 shards
          - { sport: NHL, shard_index: 0, shard_count: 2 }
          - { sport: NHL, shard_index: 1, shard_count: 2 }
          # NBA — 2 shards
          - { sport: NBA, shard_index: 0, shard_count: 2 }
          - { sport: NBA, shard_index: 1, shard_count: 2 }
          # NFL — 2 shards
          - { sport: NFL, shard_index: 0, shard_count: 2 }
          - { sport: NFL, shard_index: 1, shard_count: 2 }
          # MLB — 2 shards
          - { sport: MLB, shard_index: 0, shard_count: 2 }
          - { sport: MLB, shard_index: 1, shard_count: 2 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Chrome
        run: |
          wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y /tmp/chrome.deb || sudo apt-get -f install -y
      - name: Install Python dependencies
        run: pip install -r requirements.txt webdriver-manager scipy
      - name: Scrape ${{ matrix.sport }} premium (shard ${{ matrix.shard_index }}/${{ matrix.shard_count }})
        if: ${{ github.event.inputs.sport == '' || github.event.inputs.sport == matrix.sport }}
        run: |
          python -u scraping/scrape_master_db.py \
            --catalog-tier premium \
            --sport ${{ matrix.sport }} \
            --workers 5 \
            --stale-days 7 \
            --shard-index ${{ matrix.shard_index }} \
            --shard-count ${{ matrix.shard_count }} \
            --max-hours 0.85 \
            --limit ${{ github.event.inputs.limit || '0' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
